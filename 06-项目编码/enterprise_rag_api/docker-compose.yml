# 企业 RAG MVP · 写好即可，勿在未批准时后台常驻拉起
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "${API_PORT:-8088}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-enterprise_rag}
      QDRANT_URL: http://qdrant:6333
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started

  web:
    # 前端占位：后续替换为 Vue3 构建镜像；当前用 nginx 空页占端口
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-3080}:80"
    profiles: ["web"]

volumes:
  pgdata:
  qdrant_data:
  uploads:
